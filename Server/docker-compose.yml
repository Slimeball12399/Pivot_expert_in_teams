services:
  server:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"   # containers talk to db on its internal port
      LIVE_INTERNAL_URL: http://live:8100   # the live process's internal API, by its service name
    ports:
      - "127.0.0.1:8000:8000"   # HTTP / API (only via NGINX on the VPS)
      - "9000:9000/udp"     # live board telemetry (SCRUM-178)
      - "9001:9001"         # TCP batch ingestion (SCRUM-183)
    volumes:
      - ${STATIC_HOST_DIR:-./staticfiles}:/Server/staticfiles   # collectstatic output, served by NGINX
      - ${FILES_HOST_DIR:-./files}:/Server/files   # working files shared with live (FILES_DIR)
    depends_on:
      db:
        condition: service_healthy
      timeseries:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # The live process (python manage.py run_live): WebRTC connections of live
  # sessions. Same image as server, its own process, so deploying the web
  # server never drops a live talk.
  # Nothing published: nothing outside Docker's network reaches it. Django
  # calls its internal API as live:8100; the browsers' WebRTC traffic comes in
  # through coturn (RTC_RELAY_ONLY=True with a turn: URL in RTC_ICE_SERVERS),
  # which relays it to here.
  live:
    build: .
    # One worker, always: the connections live in this process's memory.
    # 0.0.0.0 is Docker's network (for server); nothing is published, so not
    # the internet.
    command: python -m uvicorn pivot.live_asgi:application --host 0.0.0.0 --port 8100 --workers 1 --lifespan on
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: pivot.settings_live
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ${FILES_HOST_DIR:-./files}:/Server/files   # the same working files as server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # localhost only; host port from .env (local Django, DBeaver/psql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  timeseries:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: ${TS_USER}
      POSTGRES_PASSWORD: ${TS_PASSWORD}
    volumes:
      - tsdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # localhost only; different host port so it doesn't clash with db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TS_USER} -d telemetry"]
      interval: 5s
      retries: 10

  minio:                    # S3-compatible object store for talk audio
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9090:9000"   # S3 API (localhost only)
      - "127.0.0.1:9091:9091"   # web console (localhost only)

  # One-off: creates the bucket the app stores files in (S3_BUCKET) if it isn't
  # there yet, e.g. after a fresh miniodata volume, then exits; server waits
  # for it. Running it again changes nothing (--ignore-existing). `mc ready`
  # first waits until MinIO answers (it may still be starting). mc takes the
  # server and login from MC_HOST_<alias>. The -dev variant, for its shell.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    environment:
      MC_HOST_pivot: http://${MINIO_USER}:${MINIO_PASSWORD}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc ready pivot && mc mb --ignore-existing pivot/${S3_BUCKET}"]
    depends_on:
      minio:
        condition: service_started

  # TURN/STUN server for WebRTC (coturn): the only way in from the internet
  # to the live process. Both sides use it as a relay: the browser sends its
  # audio here, the live process (inside Docker's network, RTC_RELAY_ONLY)
  # picks it up here. Needed on the VPS, so start it there with
  # `docker compose --profile turn up -d`; a plain `docker compose up` (local
  # development, where the browser reaches run_live directly) leaves it out.
  # Credentials are short-lived, made from TURN_SECRET (use-auth-secret,
  # live/turn.py), so strangers can't use it as a free relay.
  # Firewall (ufw) on the VPS: 3478 udp+tcp, 5349 tcp, 61000:65535 udp.
  coturn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    # Host networking: it must see the VPS's public IP and the relay ports
    # directly (Docker's port mapping can't map a range this big well).
    network_mode: host
    restart: unless-stopped
    volumes:
      # Let's Encrypt for TURN over TLS (5349); without a certificate, TLS is off.
      # The whole folder: live/<domain>/ only holds symlinks into archive/.
      - ${TURN_CERT_DIR:-./certs}:/certs:ro
    command:
      - -n                                   # no config file: everything is here
      - --listening-port=3478
      - --tls-listening-port=5349
      - --external-ip=${TURN_EXTERNAL_IP}
      - --realm=${TURN_REALM}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --cert=/certs/live/${TURN_REALM}/fullchain.pem
      - --pkey=/certs/live/${TURN_REALM}/privkey.pem
      # Relay ports, above Ubuntu's ephemeral range (32768-60999) that the
      # live process's aiortc picks its own ports from, so they never clash.
      - --min-port=61000
      - --max-port=65535
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # Never relay into private or local networks (the VPS's own Docker
      # network included): a TURN server must not be a way into them.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  pgdata:
  tsdata:
  miniodata: