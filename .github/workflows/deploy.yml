name: deploy

# Runs on every push/merge to prod: tests first, deploy only if they pass.
on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env for CI
        run: cp .env.example .env

      - name: Build the server image
        run: docker compose build server

      - name: Run Django tests
        run: docker compose run --rm server python manage.py test

      - name: Clean up containers
        if: always()
        run: docker compose down -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on the server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -T -p "${{ secrets.VPS_PORT }}" uni-deploy@"${{ secrets.VPS_HOST }}"
